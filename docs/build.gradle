plugins {
  id 'org.jetbrains.kotlin.jvm' version '2.3.0'
  id 'org.jetbrains.kotlin.kapt' version '2.3.0'
}

repositories {
  mavenCentral()
}

ext.kotlin_version = '2.3.0'
ext.coroutines_version = '1.10.2'
ext.ktor_version = '3.3.3'
ext.logback_version = '1.5.25'
ext.jsoup_version = '1.22.1'

kotlin {
  jvmToolchain(21)
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
  kotlinOptions.jvmTarget = "21"
}

dependencies {
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_version"
  implementation "org.jsoup:jsoup:$jsoup_version"

  implementation "io.ktor:ktor-server-core:$ktor_version"
  implementation "io.ktor:ktor-server-netty:$ktor_version"
  implementation "io.ktor:ktor-client-core:$ktor_version"
  implementation "io.ktor:ktor-client-cio:$ktor_version"

  implementation "ch.qos.logback:logback-classic:$logback_version"
}

tasks.register('fatJar', Jar) {
  archiveBaseName.set('server')
  manifest {
    attributes 'Implementation-Title': 'FlowmarblesKotlinDocs'
    attributes 'Main-Class': 'com.github.rougsig.kotlindocs.MainKt'
  }
  archiveClassifier.set('all')
  from {
    configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
  }
  with jar
}
